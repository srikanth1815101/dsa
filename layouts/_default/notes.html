{{ define "main" }}
<script src="/js/interview-manager.js"></script>
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 font-sans pb-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 md:pt-8 animate-fade-in-up">

        <!-- HEADER SECTION -->
        <div
            class="relative bg-white dark:bg-gray-800 rounded-2xl p-6 md:p-8 mb-8 border border-gray-200 dark:border-gray-700/50 shadow-sm overflow-hidden group">
            <!-- Animated Background Blobs -->
            <div class="absolute inset-0 overflow-hidden pointer-events-none rounded-2xl">
                <div
                    class="absolute -top-32 -right-32 w-96 h-96 bg-yellow-500/5 rounded-full blur-3xl group-hover:bg-yellow-500/10 transition-colors duration-700">
                </div>
                <div
                    class="absolute -bottom-32 -left-32 w-96 h-96 bg-orange-500/5 rounded-full blur-3xl group-hover:bg-orange-500/10 transition-colors duration-700">
                </div>
            </div>

            <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
                <div>
                    <div class="flex items-center gap-3 mb-2">
                        <div class="p-2 bg-yellow-100 dark:bg-yellow-900/30 rounded-lg">
                            <i data-lucide="book-open" class="w-6 h-6 text-yellow-600 dark:text-yellow-400"></i>
                        </div>
                        <h1 class="text-2xl md:text-3xl font-black text-gray-900 dark:text-white tracking-tight">
                            Personal Notes
                        </h1>
                    </div>
                    <p class="text-gray-500 dark:text-gray-400 max-w-xl">
                        A collection of your thoughts, problem strategies, and interview reflections.
                    </p>
                </div>
            </div>
        </div>

        <!-- TABS -->
        <div class="flex gap-4 mb-6 border-b border-gray-200 dark:border-gray-700">
            <button id="tab-problems" onclick="switchTab('problems')"
                class="pb-3 px-4 text-sm font-bold border-b-2 border-primary text-primary transition-colors">
                Problem Notes
            </button>
            <button id="tab-reflections" onclick="switchTab('reflections')"
                class="pb-3 px-4 text-sm font-bold border-b-2 border-transparent text-gray-500 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 transition-colors">
                Reflections
            </button>
        </div>

        <!-- CONTENT CONTAINERS -->
        <div id="container-problems" class="space-y-4">
            <!-- Problem Notes List -->
            <div id="problem-notes-list" class="space-y-3">
                <div class="py-12 text-center text-gray-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                    <p>Loading notes...</p>
                </div>
            </div>
        </div>

        <div id="container-reflections" class="hidden space-y-4">
            <!-- Reflections List -->
            <div id="reflections-list" class="space-y-3">
                <div class="py-12 text-center text-gray-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                    <p>Loading reflections...</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    const manager = window.InterviewManager;

    (function () {
        loadData();
        lucide.createIcons();
    })();

    function switchTab(tab) {
        const problemsTab = document.getElementById('tab-problems');
        const reflectionsTab = document.getElementById('tab-reflections');
        const problemsContainer = document.getElementById('container-problems');
        const reflectionsContainer = document.getElementById('container-reflections');

        if (tab === 'problems') {
            problemsTab.classList.add('border-primary', 'text-primary');
            problemsTab.classList.remove('border-transparent', 'text-gray-500', 'dark:text-gray-400');
            reflectionsTab.classList.remove('border-primary', 'text-primary');
            reflectionsTab.classList.add('border-transparent', 'text-gray-500', 'dark:text-gray-400');

            problemsContainer.classList.remove('hidden');
            reflectionsContainer.classList.add('hidden');
        } else {
            reflectionsTab.classList.add('border-primary', 'text-primary');
            reflectionsTab.classList.remove('border-transparent', 'text-gray-500', 'dark:text-gray-400');
            problemsTab.classList.remove('border-primary', 'text-primary');
            problemsTab.classList.add('border-transparent', 'text-gray-500', 'dark:text-gray-400');

            reflectionsContainer.classList.remove('hidden');
            problemsContainer.classList.add('hidden');
        }
    }

    // Toggle Note Expansion
    function toggleNote(id) {
        const content = document.getElementById(`content-${id}`);
        const icon = document.getElementById(`icon-${id}`);

        if (content.classList.contains('hidden')) {
            content.classList.remove('hidden');
            icon.style.transform = 'rotate(180deg)';
        } else {
            content.classList.add('hidden');
            icon.style.transform = 'rotate(0deg)';
        }
    }

    async function loadData() {
        // 1. Load Problem Notes
        const notesRaw = localStorage.getItem('dsa-notes');
        const notesData = notesRaw ? JSON.parse(notesRaw) : {};
        const problemNotesContainer = document.getElementById('problem-notes-list');

        if (Object.keys(notesData).length === 0) {
            renderEmptyState(problemNotesContainer, 'No problem notes yet.', 'dsa');
        } else {
            // Need problem meta for titles
            const allProblems = await manager.getProblems();
            const probMap = {};
            allProblems.forEach(p => {
                const id = p.id || p.permalink.replace(/\/$/, '').split('/').pop();
                probMap[id] = p;
            });

            const items = Object.entries(notesData).map(([id, content]) => {
                const prob = probMap[id];
                return {
                    id,
                    title: prob ? prob.title : id,
                    content,
                    difficulty: prob ? prob.difficulty : 'Unknown',
                    permalink: prob ? prob.permalink : '#'
                };
            }).filter(item => item.content.trim() !== '');

            if (items.length === 0) {
                renderEmptyState(problemNotesContainer, 'No problem notes found.', 'dsa');
            } else {
                problemNotesContainer.innerHTML = items.map(item => `
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700/50 shadow-sm overflow-hidden transition-all duration-300">
                        <!-- Header / Toggle -->
                        <button onclick="toggleNote('note-${item.id}')" class="w-full flex items-center justify-between p-4 bg-gray-50/50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-700/50 transition-colors text-left">
                            <div class="flex items-center gap-3">
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider shrink-0 w-16 text-center ${getBadgeStyle(item.difficulty)}">
                                    ${item.difficulty}
                                </span>
                                <span class="font-bold text-gray-900 dark:text-white line-clamp-1">
                                    ${item.title}
                                </span>
                            </div>
                            <div class="flex items-center gap-3">
                                <i data-lucide="chevron-down" id="icon-note-${item.id}" class="w-5 h-5 text-gray-400 transition-transform duration-300"></i>
                            </div>
                        </button>
                        
                        <!-- Content -->
                        <div id="content-note-${item.id}" class="hidden p-5 border-t border-gray-100 dark:border-gray-700/50 bg-white dark:bg-gray-800">
                            <div class="prose prose-sm dark:prose-invert max-w-none text-gray-600 dark:text-gray-300 whitespace-pre-wrap">
${item.content}
                            </div>
                            <div class="mt-4 pt-3 flex justify-end">
                                <a href="${item.permalink}" class="text-xs font-bold text-gray-400 hover:text-primary transition-colors flex items-center gap-1">
                                    View Problem <i data-lucide="external-link" class="w-3 h-3"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // 2. Load Reflections
        const db = manager.db;
        const reflectionsContainer = document.getElementById('reflections-list');

        if (!db.sessions) {
            renderEmptyState(reflectionsContainer, 'No interview reflections yet.', 'interview');
        } else {
            const sessions = Object.values(db.sessions)
                .filter(s => s.notes && s.notes.reflection && s.notes.reflection.trim() !== '')
                .sort((a, b) => b.createdAt - a.createdAt);

            if (sessions.length === 0) {
                renderEmptyState(reflectionsContainer, 'No reflections saved.', 'interview');
            } else {
                reflectionsContainer.innerHTML = sessions.map(s => {
                    const date = new Date(s.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
                    return `
                    <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-100 dark:border-gray-700/50 shadow-sm overflow-hidden transition-all duration-300">
                        <!-- Header -->
                        <button onclick="toggleNote('session-${s.id}')" class="w-full flex items-center justify-between p-4 bg-gray-50/50 dark:bg-gray-800/50 hover:bg-gray-100 dark:hover:bg-gray-700/50 transition-colors text-left">
                            <div class="flex items-center gap-3">
                                <div class="flex items-center gap-2 text-purple-600 dark:text-purple-400">
                                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                                    <span class="font-bold text-gray-900 dark:text-white">
                                        ${s.title || 'Session Reflection'}
                                    </span>
                                </div>
                            </div>
                            <div class="flex items-center gap-3">
                                <span class="text-xs font-medium text-gray-400">${date}</span>
                                <i data-lucide="chevron-down" id="icon-session-${s.id}" class="w-5 h-5 text-gray-400 transition-transform duration-300"></i>
                            </div>
                        </button>
                        
                        <!-- Content -->
                        <div id="content-session-${s.id}" class="hidden p-5 border-t border-gray-100 dark:border-gray-700/50 bg-white dark:bg-gray-800">
                            <div class="prose prose-sm dark:prose-invert max-w-none text-gray-600 dark:text-gray-300 whitespace-pre-wrap">
${s.notes.reflection}
                            </div>
                            <div class="mt-4 pt-3 flex justify-end">
                                <a href="/interview/review/?id=${s.id}" class="text-xs font-bold text-gray-400 hover:text-purple-500 transition-colors flex items-center gap-1">
                                    View Session <i data-lucide="external-link" class="w-3 h-3"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                    `;
                }).join('');
            }
        }
        lucide.createIcons();
    }

    function renderEmptyState(container, message, type) {
        container.innerHTML = `
            <div class="col-span-full py-16 text-center border-2 border-dashed border-gray-200 dark:border-gray-800 rounded-2xl">
                 <div class="bg-gray-100 dark:bg-gray-800 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="${type === 'dsa' ? 'edit-3' : 'anchor'}" class="w-8 h-8 text-gray-400"></i>
                </div>
                <p class="text-gray-500 dark:text-gray-400 font-medium">${message}</p>
                ${type === 'dsa'
                ? `<a href="/problems/" class="inline-block mt-4 text-primary font-bold hover:underline text-sm">Solve a problem</a>`
                : `<a href="/interview/" class="inline-block mt-4 text-purple-600 font-bold hover:underline text-sm">Start an interview</a>`
            }
            </div>
        `;
    }

    function getBadgeStyle(diff) {
        if (diff === 'Easy') return 'bg-green-100 text-green-700 border-green-200 dark:bg-green-500/10 dark:text-green-400';
        if (diff === 'Medium') return 'bg-yellow-100 text-yellow-700 border-yellow-200 dark:bg-yellow-500/10 dark:text-yellow-400';
        return 'bg-red-100 text-red-700 border-red-200 dark:bg-red-500/10 dark:text-red-400';
    }

</script>
{{ end }}
