{{ define "main" }}
<!-- Full Screen Layout for Interview Mode (Hides default header/footer via CSS override if needed, but we use the "main" block) -->
<!-- We'll use a fixed layout here -->
<script src="/js/interview-manager.js"></script>

<style>
    /* Override global scrollbar for interview mode to be distraction-free */
    ::-webkit-scrollbar-thumb {
        background: #cbd5e1 !important;
        /* gray-300 */
        border-radius: 6px;
    }

    html.dark ::-webkit-scrollbar-thumb {
        background: #4b5563 !important;
        /* gray-600 */
    }

    /* Hide global scrollbar */
    html,
    body {
        overflow: hidden !important;
        height: 100% !important;
    }
</style>

<div class="fixed inset-0 z-50 bg-gray-50 dark:bg-gray-900 flex flex-col">

    <!-- TOP BAR -->
    <header
        class="h-16 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-800 flex items-center justify-between px-4 lg:px-6 shadow-sm z-40 relative">
        <!-- LEFT: BRAND / INFO -->
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary/10 to-blue-500/10 flex items-center justify-center text-primary shadow-sm p-2">
                <img src="/logo.png" alt="CSRGO" class="w-full h-full object-contain">
            </div>
            <div>
                <h1 class="font-bold text-gray-900 dark:text-gray-100 text-sm leading-tight leading-none">Interview
                    Session</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
                    <span
                        class="text-[10px] uppercase tracking-wider font-bold text-gray-500 dark:text-gray-400">Live</span>
                </div>
            </div>
        </div>

        <!-- CENTER: SPACER (Removed Floating Timer) -->
        <div class="hidden md:block"></div>

        <!-- RIGHT: ACTIONS -->
        <div class="flex items-center gap-4">
            <!-- Integrated Timer -->
            <div
                class="flex items-center gap-2 px-3 py-1.5 bg-gray-50 dark:bg-gray-800/50 rounded-lg border border-gray-100 dark:border-gray-700/50">
                <i data-lucide="clock" class="w-4 h-4 text-primary"></i>
                <span class="font-mono font-bold text-gray-700 dark:text-gray-200 tabular-nums text-sm tracking-widest"
                    id="timer-display">00:00</span>
                <!-- Hidden progress element to prevent JS errors -->
                <div id="timer-progress" class="hidden"></div>
            </div>

            <button onclick="endInterview()"
                class="group flex items-center justify-center gap-2 px-4 py-2 rounded-xl bg-gradient-to-br from-red-500 to-rose-600 text-white shadow-lg shadow-red-500/20 hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">
                <i data-lucide="power" class="w-4 h-4"></i>
                <span class="text-xs font-bold">End Session</span>
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- SIDEBAR: PROBLEMS LIST -->
        <aside
            class="w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 flex flex-col shrink-0">
            <div class="p-4 border-b border-gray-100 dark:border-gray-700/50">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Problems</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-2 space-y-2" id="problem-list">
                <!-- JS Injected -->
            </div>
        </aside>

        <!-- MAIN CONTENT: PROBLEM + NOTES -->
        <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

            <!-- PROBLEM VIEW -->
            <div class="flex-1 overflow-y-auto p-6 md:p-10 scroll-smooth" id="problem-container">
                <div id="loading-state"
                    class="flex flex-col items-center justify-center h-full text-gray-400 animate-pulse">
                    <i data-lucide="loader-2" class="w-10 h-10 animate-spin mb-4"></i>
                    <p>Loading problem...</p>
                </div>
                <article class="prose prose-lg dark:prose-invert max-w-3xl mx-auto hidden" id="problem-content">
                    <!-- Content Injected Here -->
                </article>
            </div>

            <!-- RESIZABLE DRAG HANDLE (Optional, doing fixed width for now) -->

            <!-- SCRATCHPAD (Right Side / Bottom) -->
            <div
                class="w-full md:w-96 bg-white/80 dark:bg-gray-900/80 backdrop-blur-md border-l border-gray-200 dark:border-gray-800 flex flex-col shadow-2xl z-20">
                <div
                    class="p-4 border-b border-gray-200 dark:border-gray-800 flex items-center justify-between bg-gradient-to-r from-gray-50 to-white dark:from-gray-900 dark:to-gray-800/50">
                    <span class="text-sm font-bold text-gray-700 dark:text-gray-200 flex items-center gap-2">
                        <div class="p-1.5 bg-indigo-50 dark:bg-indigo-900/20 rounded-lg text-indigo-500">
                            <i data-lucide="file-edit" class="w-4 h-4"></i>
                        </div>
                        Scratchpad
                    </span>
                    <span id="save-status"
                        class="text-[10px] font-bold text-gray-400 uppercase tracking-widest transition-opacity duration-300"></span>
                </div>

                <div class="flex-1 relative group">
                    <textarea id="scratchpad"
                        class="w-full h-full p-5 bg-transparent resize-none focus:outline-none font-mono text-sm text-gray-800 dark:text-gray-200 leading-relaxed placeholder-gray-400 dark:placeholder-gray-600"
                        placeholder="// Write your approach, complexities, or pseudocode here..."></textarea>

                    <!-- Decorative corner -->
                    <div
                        class="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
                        <i data-lucide="corner-down-right" class="w-4 h-4 text-gray-300 dark:text-gray-600"></i>
                    </div>
                </div>

                <div
                    class="p-5 border-t border-gray-200 dark:border-gray-800 bg-gray-50/50 dark:bg-gray-900/50 space-y-4 backdrop-blur-sm">
                    <div class="flex gap-3">
                        <button onclick="markProblem('solved')" id="btn-solve"
                            class="flex-1 py-3 rounded-xl border border-green-200 dark:border-green-800 bg-white dark:bg-gray-800 text-green-600 dark:text-green-400 font-bold text-sm shadow-sm hover:shadow-green-500/10 hover:bg-green-50 dark:hover:bg-green-900/20 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 group">
                            <i data-lucide="check-circle-2"
                                class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                            Solved
                        </button>
                        <button onclick="markProblem('attempted')" id="btn-attempt"
                            class="flex-1 py-3 rounded-xl border border-yellow-200 dark:border-yellow-800 bg-white dark:bg-gray-800 text-yellow-600 dark:text-yellow-400 font-bold text-sm shadow-sm hover:shadow-yellow-500/10 hover:bg-yellow-50 dark:hover:bg-yellow-900/20 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 group">
                            <i data-lucide="minus-circle"
                                class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                            Attempted
                        </button>
                    </div>
                    <button onclick="nextProblem()" id="btn-next"
                        class="w-full py-3 bg-gradient-to-r from-primary to-blue-600 text-white rounded-xl font-bold font-mono text-sm shadow-lg shadow-primary/20 hover:shadow-primary/30 hover:scale-[1.02] active:scale-[0.98] transition-all hidden flex items-center justify-center gap-2">
                        Next Problem <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </main>
    </div>
</div>
<!-- END SESSION MODAL -->
<div id="end-session-modal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-gray-900/60 backdrop-blur-md px-4 animate-fade-in">
    <div
        class="bg-white dark:bg-gray-800 w-full max-w-sm p-6 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 relative overflow-hidden animate-scale-up">

        <!-- Decorative Gradient Blob -->
        <div
            class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 bg-red-500/10 rounded-full blur-2xl pointer-events-none">
        </div>

        <div class="text-center relative z-10">
            <div
                class="w-12 h-12 bg-red-50 dark:bg-red-900/20 rounded-xl mx-auto flex items-center justify-center mb-4">
                <i data-lucide="alert-triangle" class="w-6 h-6 text-red-500"></i>
            </div>

            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">End Interview?</h3>
            <p class="text-gray-500 dark:text-gray-400 text-sm mb-6">
                Are you sure you want to finish this session? Your progress will be saved.
            </p>

            <div class="flex gap-3">
                <button onclick="closeEndModal()"
                    class="flex-1 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 font-bold text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700/50 transition-colors">
                    Cancel
                </button>
                <button onclick="confirmEndSession()"
                    class="flex-1 py-2.5 rounded-xl bg-gradient-to-r from-red-500 to-rose-600 text-white font-bold text-sm hover:shadow-lg hover:shadow-red-500/20 hover:scale-[1.02] transition-all">
                    End Session
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const manager = window.InterviewManager;
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('id');
    let session = null;
    let currentProblemIndex = 0;

    // Init
    (async function () {
        if (!sessionId) {
            window.location.href = '/interview/';
            return;
        }

        session = manager.loadSession(sessionId);
        if (!session) {
            alert("Session not found.");
            window.location.href = '/interview/';
            return;
        }

        if (session.state.status !== 'active') {
            window.location.href = `/interview/review/?id=${sessionId}`;
            return;
        }

        // Setup UI
        renderProblemList();
        loadProblem(session.state.currentProblemIndex);
        manager.startTimer(updateTimerUI, onTimerFinished);
        lucide.createIcons();

        // Notes Autosave
        const scratchpad = document.getElementById('scratchpad');
        scratchpad.addEventListener('input', debounce(() => {
            manager.updateProblem(currentProblemIndex, { notes: scratchpad.value });
            document.getElementById('save-status').textContent = 'Saved';
            setTimeout(() => document.getElementById('save-status').textContent = '', 2000);
        }, 1000));

        scratchpad.addEventListener('input', () => {
            document.getElementById('save-status').textContent = 'Typing...';
        });
    })();

    // Handle Timer Finish
    function onTimerFinished() {
        // 1. Play Alarm Sound
        playAlarm();

        // 2. Show Modal
        const modal = document.getElementById('end-session-modal');
        const title = modal.querySelector('h3');
        const desc = modal.querySelector('p');
        const buttons = modal.querySelector('.flex.gap-3');

        title.textContent = "Time's Up!";
        title.className = "text-xl font-bold text-red-500 mb-2";
        desc.innerHTML = `The interview duration has ended.<br>Auto-closing session in <span id="auto-submit-timer" class="font-bold text-gray-900 dark:text-white">10</span> seconds...`;

        // Hide cancel button, force end
        buttons.innerHTML = `
            <button onclick="confirmEndSession()" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-red-500 to-rose-600 text-white font-bold text-sm hover:shadow-lg hover:shadow-red-500/20 hover:scale-[1.02] transition-all">
                End Session Now
            </button>
        `;

        modal.classList.remove('hidden');
        modal.classList.add('flex');

        // 3. Countdown & Auto-End with Tick Sound
        let timeLeft = 10;
        const interval = setInterval(() => {
            timeLeft--;
            const span = document.getElementById('auto-submit-timer');
            if (span) span.textContent = timeLeft;

            if (timeLeft > 0) {
                playTick(); // Tick sound every second
            }

            if (timeLeft <= 0) {
                clearInterval(interval);
                confirmEndSession();
            }
        }, 1000);
    }

    // Initial Alarm Beep
    function playAlarm() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(880, ctx.currentTime + 0.1);
            osc.frequency.linearRampToValueAtTime(440, ctx.currentTime + 0.3);

            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        } catch (e) { console.error(e); }
    }

    // Countdown Tick Sound
    function playTick() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, ctx.currentTime);

            gain.gain.setValueAtTime(0.05, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start();
            osc.stop(ctx.currentTime + 0.1);
        } catch (e) { console.error(e); }
    }

    function updateTimerUI(s) {
        const display = document.getElementById('timer-display');
        const progress = document.getElementById('timer-progress');

        display.textContent = manager.formatTime(s.state.remainingSeconds);

        const total = s.config.duration * 60;
        const pct = (s.state.remainingSeconds / total) * 100;
        progress.style.width = `${pct}%`;

        if (s.state.remainingSeconds < 60) {
            display.classList.add('text-red-500');
            progress.classList.add('bg-red-500');
        }
    }

    async function loadProblem(index) {
        currentProblemIndex = index;
        session.state.currentProblemIndex = index;
        manager.saveDB(); // Persist view

        // UI Updates
        renderProblemList();
        const prob = session.problems[index];
        const container = document.getElementById('problem-content');
        const loader = document.getElementById('loading-state');
        const scratchpad = document.getElementById('scratchpad');

        loader.classList.remove('hidden');
        container.classList.add('hidden');

        // Populate existing data
        scratchpad.value = prob.notes || '';
        document.getElementById('save-status').textContent = '';

        // Status buttons state
        updateStatusButtons(prob.status);

        try {
            // FETCH CONTENT
            const res = await fetch(prob.permalink);
            const text = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'text/html');

            // Extract .prose
            const prose = doc.querySelector('.prose');

            // Extract Examples and Constraints (using IDs we added)
            const examples = doc.querySelector('#problem-examples')?.parentElement; // Parent space-y-4
            const constraints = doc.querySelector('#problem-constraints');

            if (prose) {
                let contentHTML = `
                    <h1 class="text-3xl font-black mb-4 text-gray-900 dark:text-white">${prob.title}</h1>
                    <div class="flex gap-2 mb-8">
                        <span class="px-2 py-0.5 rounded text-xs font-bold border ${getBadgeColor(prob.difficulty)}">${prob.difficulty}</span>
                    </div>
                    ${prose.innerHTML}
                `;

                // RE-RENDER EXAMPLES (Clean, no cards)
                // We select all elements with id="problem-examples" (browsers handle dupes in querySelectorAll)
                const exampleCards = doc.querySelectorAll('#problem-examples');
                if (exampleCards.length > 0) {
                    contentHTML += `<div class="mt-8 pt-8 border-t border-gray-100 dark:border-gray-800">
                        <h3 class="font-bold text-gray-900 dark:text-white mb-4 text-lg">Examples</h3>
                        <div class="space-y-6">`;

                    exampleCards.forEach((card) => {
                        // Extract Title
                        const title = card.querySelector('span.uppercase')?.textContent.trim() || 'Example';

                        // Extract Content Rows (Input, Output, Notes)
                        // The structure in single.html is .space-y-4 > div > span labels
                        // We will just grab the rows which are flex containers
                        const rows = card.querySelectorAll('.font-mono > div');

                        contentHTML += `<div class="space-y-2">
                            <p class="font-bold text-sm text-gray-700 dark:text-gray-300">${title}</p>
                            <div class="pl-3 border-l-2 border-primary/20 space-y-2">`;

                        rows.forEach(row => {
                            // Cloning internal logic to simplify
                            const label = row.querySelector('span:first-child')?.textContent.replace(':', '') || '';
                            const value = row.querySelector('span:last-child')?.textContent || '';
                            const isNote = label === 'Notes';

                            if (label && value) {
                                contentHTML += `
                                    <div class="text-sm">
                                        <span class="font-bold text-gray-500 dark:text-gray-500 w-16 inline-block">${label}:</span>
                                        <span class="${isNote ? 'text-gray-600 dark:text-gray-400' : 'font-mono text-gray-800 dark:text-gray-200'}">${value}</span>
                                    </div>`;
                            }
                        });

                        contentHTML += `</div></div>`;
                    });
                    contentHTML += `</div></div>`;
                }

                // RE-RENDER CONSTRAINTS (Simple list)
                const constraintItems = doc.querySelectorAll('#problem-constraints li span.font-mono');
                if (constraintItems.length > 0) {
                    contentHTML += `<div class="mt-8 pt-8 border-t border-gray-100 dark:border-gray-800">
                        <h3 class="font-bold text-gray-900 dark:text-white mb-4 text-lg">Constraints</h3>
                        <ul class="list-disc list-outside ml-5 space-y-1 text-sm text-gray-700 dark:text-gray-300 font-mono">`;

                    constraintItems.forEach(item => {
                        contentHTML += `<li>${item.innerHTML}</li>`;
                    });

                    contentHTML += `</ul></div>`;
                }

                container.innerHTML = contentHTML;
            } else {
                container.innerHTML = "<p>Error parsing problem content.</p>";
            }
        } catch (e) {
            console.error(e);
            container.innerHTML = "<p>Failed to load problem.</p>";
        } finally {
            loader.classList.add('hidden');
            container.classList.remove('hidden');
            // Re-run Prism or syntax highlighting if needed (not active in this setup, assumes static CSS)
        }

        // Show Next button if valid
        const nextBtn = document.getElementById('btn-next');
        if (index < session.problems.length - 1) {
            nextBtn.classList.remove('hidden');
        } else {
            nextBtn.classList.add('hidden');
        }
    }

    function renderProblemList() {
        const list = document.getElementById('problem-list');
        list.innerHTML = session.problems.map((p, i) => {
            const isActive = i === currentProblemIndex;
            return `
            <button onclick="loadProblem(${i})" ${isActive ? 'id="active-problem-item"' : ''}
                class="w-full text-left px-3 py-3 rounded-lg text-sm font-medium transition-all mb-1.5 flex items-start gap-3 group relative overflow-hidden
                ${isActive
                    ? 'bg-blue-50 dark:bg-blue-900/10 text-primary border border-blue-100 dark:border-blue-900/30 shadow-sm'
                    : 'text-gray-600 dark:text-gray-400 hover:bg-gray-50 dark:hover:bg-gray-800 border border-transparent hover:border-gray-100 dark:hover:border-gray-700/50'}">
                
                ${isActive ? '<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>' : ''}

                <div class="mt-0.5 shrink-0 transition-transform ${isActive ? 'scale-110' : 'group-hover:scale-105'}">
                     ${getStatusIcon(p.status, isActive)}
                </div>

                <div class="min-w-0 pt-0.5">
                    <span class="truncate leading-tight font-bold ${isActive ? 'text-gray-900 dark:text-white' : 'text-gray-700 dark:text-gray-300'}">
                        <span class="opacity-60 mr-1 font-mono">${i + 1}.</span>${p.title}
                    </span>
                </div>
            </button>
        `}).join('');
        lucide.createIcons();

        // Auto-scroll to active
        setTimeout(() => {
            const active = document.getElementById('active-problem-item');
            if (active) {
                active.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }, 50);
    }

    function getStatusIcon(status, isActive) {
        if (status === 'solved') return `<div class="bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 rounded p-0.5"><i data-lucide="check" class="w-3.5 h-3.5"></i></div>`;
        if (status === 'attempted') return `<div class="bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 rounded p-0.5"><i data-lucide="minus" class="w-3.5 h-3.5"></i></div>`;

        // Default / Pending
        if (isActive) {
            // Active (Pending): Clean box with primary border, matching text theme
            return `<div class="bg-white dark:bg-gray-800 border-2 border-blue-500 dark:border-blue-400 rounded w-[18px] h-[18px] shadow-sm"></div>`;
        }
        return `<div class="border border-gray-300 dark:border-gray-600 rounded w-[18px] h-[18px] bg-white dark:bg-gray-800/50"></div>`;
    }

    function getBadgeColor(diff) {
        if (diff === 'Easy') return 'bg-green-100 text-green-700 border-green-200 dark:bg-green-900/30 dark:text-green-400 dark:border-green-800';
        if (diff === 'Medium') return 'bg-yellow-100 text-yellow-700 border-yellow-200 dark:bg-yellow-900/30 dark:text-yellow-400 dark:border-yellow-800';
        return 'bg-red-100 text-red-700 border-red-200 dark:bg-red-900/30 dark:text-red-400 dark:border-red-800';
    }

    function markProblem(status) {
        manager.updateProblem(currentProblemIndex, { status });
        renderProblemList();
        updateStatusButtons(status);
        lucide.createIcons(); // Re-init icons for the list

        // Sound effect (simulated visual for now)
        if (status === 'solved') {
            // confetti?
        }
    }

    function updateStatusButtons(status) {
        const btnSolve = document.getElementById('btn-solve');
        const btnAttempt = document.getElementById('btn-attempt');

        // Reset classes (to default idle state)
        const defaultSolve = "flex-1 py-3 rounded-xl border border-green-200 dark:border-green-800 bg-white dark:bg-gray-800 text-green-600 dark:text-green-400 font-bold text-sm shadow-sm hover:shadow-green-500/10 hover:bg-green-50 dark:hover:bg-green-900/20 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 group";
        const defaultAttempt = "flex-1 py-3 rounded-xl border border-yellow-200 dark:border-yellow-800 bg-white dark:bg-gray-800 text-yellow-600 dark:text-yellow-400 font-bold text-sm shadow-sm hover:shadow-yellow-500/10 hover:bg-yellow-50 dark:hover:bg-yellow-900/20 hover:-translate-y-0.5 transition-all flex items-center justify-center gap-2 group";

        btnSolve.className = defaultSolve;
        btnAttempt.className = defaultAttempt;

        if (status === 'solved') {
            // Active Solved State
            btnSolve.className = "flex-1 py-3 rounded-xl bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold text-sm shadow-lg shadow-green-500/20 hover:scale-[1.02] transition-all flex items-center justify-center gap-2";
        }
        if (status === 'attempted') {
            // Active Attempted State
            btnAttempt.className = "flex-1 py-3 rounded-xl bg-gradient-to-r from-yellow-400 to-amber-500 text-white font-bold text-sm shadow-lg shadow-yellow-500/20 hover:scale-[1.02] transition-all flex items-center justify-center gap-2";
        }
    }

    function nextProblem() {
        if (currentProblemIndex < session.problems.length - 1) {
            loadProblem(currentProblemIndex + 1);
        }
    }

    function endInterview() {
        // Show Modal
        const modal = document.getElementById('end-session-modal');
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeEndModal() {
        const modal = document.getElementById('end-session-modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    }

    function confirmEndSession() {
        manager.endSession();
    }

    function debounce(func, wait) {
        let timeout;
        return function (...args) {
            clearTimeout(timeout);
            timeout = setTimeout(() => func.apply(this, args), wait);
        };
    }
</script>
