{{ define "main" }}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 font-sans pb-6">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 pt-12 md:pt-16 animate-fade-in-up">

        <!-- HERO SECTION -->
        <div class="text-center mb-12 relative">
            <!-- Decorative Blobs -->
            <div
                class="absolute -top-10 -left-10 w-32 h-32 bg-primary/10 rounded-full blur-3xl pointer-events-none animate-pulse">
            </div>
            <div
                class="absolute -bottom-10 -right-10 w-32 h-32 bg-secondary/10 rounded-full blur-3xl pointer-events-none animate-pulse animation-delay-1000">
            </div>

            <h1
                class="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-gray-900 via-gray-700 to-gray-900 dark:from-white dark:via-gray-200 dark:to-white tracking-tight leading-tight mb-4 relative z-10">
                {{ .Title }}
            </h1>
            <p
                class="text-lg md:text-xl text-gray-500 dark:text-gray-400 font-medium max-w-2xl mx-auto leading-relaxed">
                {{ .Params.description }}
            </p>
        </div>

        <!-- CONTENT CARD -->
        <article
            class="bg-white dark:bg-gray-800 rounded-3xl p-6 md:p-12 shadow-xl shadow-gray-200/50 dark:shadow-none border border-gray-100 dark:border-gray-700/50 relative overflow-hidden">

            <!-- Gradient Border Top -->
            <div
                class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary via-purple-500 to-secondary opacity-80">
            </div>

            <div class="prose prose-lg dark:prose-invert max-w-none 
                prose-headings:font-bold prose-headings:text-gray-900 dark:prose-headings:text-white
                prose-h2:text-2xl md:prose-h2:text-3xl prose-h2:border-b prose-h2:border-gray-100 dark:prose-h2:border-gray-700 prose-h2:pb-4 prose-h2:mt-12 prose-h2:mb-6
                prose-h3:text-xl md:prose-h3:text-2xl prose-h3:text-primary dark:prose-h3:text-primary/90 prose-h3:mt-8
                prose-p:text-gray-600 dark:prose-p:text-gray-300 prose-p:leading-relaxed
                prose-strong:text-gray-900 dark:prose-strong:text-white prose-strong:font-bold
                prose-ul:space-y-2 prose-li:text-gray-600 dark:prose-li:text-gray-300
                prose-code:text-primary dark:prose-code:text-primary/90 prose-code:bg-primary/5 dark:prose-code:bg-primary/10 prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded-lg prose-code:font-bold prose-code:before:content-none prose-code:after:content-none
                ">
                {{ .Content }}
            </div>

        </article>

    </div>
</div>
{{ end }}
