{{ define "main" }}
<script src="/js/interview-manager.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 font-sans pb-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 md:pt-8 animate-fade-in-up">

        <!-- Enhanced Header Card -->
        <div
            class="relative bg-white dark:bg-gray-800 rounded-2xl p-6 md:p-8 mb-12 border border-gray-200 dark:border-gray-700/50 shadow-sm group overflow-hidden">

            <!-- Animated Background Blobs -->
            <div class="absolute inset-0 overflow-hidden pointer-events-none rounded-2xl">
                <div
                    class="absolute -top-32 -right-32 w-96 h-96 bg-primary/5 rounded-full blur-3xl group-hover:bg-primary/10 transition-colors duration-700">
                </div>
                <div
                    class="absolute -bottom-32 -left-32 w-96 h-96 bg-secondary/5 rounded-full blur-3xl group-hover:bg-secondary/10 transition-colors duration-700">
                </div>
            </div>

            <div class="relative z-10 flex flex-col md:flex-row md:items-end justify-between gap-8">
                <div class="flex-1">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="p-2 bg-gradient-to-br from-primary/10 to-blue-500/10 rounded-xl">
                            <i data-lucide="notebook-pen" class="w-6 h-6 text-primary"></i>
                        </div>
                        <h1
                            class="text-3xl md:text-4xl font-extrabold text-gray-900 dark:text-white tracking-tight leading-tight">
                            Personal Notes
                        </h1>
                    </div>

                    <p class="text-gray-500 dark:text-gray-400 max-w-xl text-lg leading-relaxed">
                        A collection of your thoughts, problem strategies, and interview reflections.
                    </p>
                </div>

                <!-- Stats / Decoration -->
                <div class="hidden md:flex items-center gap-2">
                    <button onclick="openDownloadModal()"
                        class="px-4 py-2 bg-primary/10 text-primary hover:bg-primary/20 rounded-lg border border-primary/20 font-bold text-sm transition-all flex items-center gap-2">
                        <i data-lucide="download" class="w-4 h-4"></i> Download PDF
                    </button>

                </div>
            </div>
        </div>

        <!-- TABS & CONTROLS -->
        <div class="flex flex-col lg:flex-row gap-6 mb-8 justify-between items-start lg:items-center">

            <!-- Pill Tabs -->
            <div
                class="bg-white dark:bg-gray-800 p-1 rounded-full border border-gray-200 dark:border-gray-700/50 shadow-sm flex w-full md:inline-flex md:w-auto">
                <button onclick="switchTab('problems')" id="tab-problems"
                    class="flex-1 md:flex-none justify-center px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 flex items-center gap-2">
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                    Problem Notes
                </button>
                <button onclick="switchTab('reflections')" id="tab-reflections"
                    class="flex-1 md:flex-none justify-center px-6 py-2 rounded-full text-sm font-semibold text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-all duration-300 flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    Reflections
                </button>
            </div>

            <!-- Search and Filters -->
            <div class="w-full lg:w-auto flex flex-wrap gap-3">
                <div class="relative group w-full md:w-auto md:flex-initial">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="search"
                            class="h-4 w-4 text-gray-400 group-focus-within:text-primary transition-colors"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search notes..."
                        class="pl-10 pr-4 py-2.5 w-full md:w-64 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/50 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm transition-all shadow-sm">
                </div>

                <div class="relative group flex-1 min-w-[140px]" id="difficultyFilterContainer">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="bar-chart-2"
                            class="h-4 w-4 text-gray-400 group-focus-within:text-primary transition-colors"></i>
                    </div>
                    <select id="difficultyFilter"
                        class="pl-10 pr-8 py-2.5 w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/50 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm appearance-none cursor-pointer shadow-sm transition-all whitespace-nowrap overflow-hidden text-ellipsis">
                        <option value="">All Difficulties</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <i data-lucide="chevron-down" class="h-4 w-4 text-gray-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENT CONTAINERS -->
        <div id="container-problems" class="space-y-4">
            <!-- No Results State -->
            <div id="noResults" class="hidden text-center py-12">
                <div
                    class="bg-gray-50 dark:bg-gray-800 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="search-x" class="w-8 h-8 text-gray-400"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">No matches found</h3>
                <p class="text-gray-500 dark:text-gray-400">Try adjusting your search.</p>
            </div>

            <!-- Problem Notes List -->
            <div id="problem-notes-list" class="space-y-3">
                <div class="py-12 text-center text-gray-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                    <p>Loading notes...</p>
                </div>
            </div>
        </div>

        <!-- Reflections Container (Previously missing in this reconstruction but present in file) -->
        <div id="container-reflections" class="hidden space-y-4">
            <!-- No Results State Reflections -->
            <div id="noResultsReflections" class="hidden text-center py-12">
                <div
                    class="bg-gray-50 dark:bg-gray-800 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="search-x" class="w-8 h-8 text-gray-400"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">No matches found</h3>
                <p class="text-gray-500 dark:text-gray-400">Try adjusting your search.</p>
            </div>

            <!-- Reflections List -->
            <div id="reflections-list" class="space-y-3">
                <div class="py-12 text-center text-gray-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                    <p>Loading reflections...</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="/js/notes-features.js"></script>

<!-- Download Modal -->
<div id="downloadModal" class="fixed inset-0 z-50 hidden">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm" onclick="closeDownloadModal()"></div>

    <!-- Modal Content -->
    <div
        class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-200 dark:border-gray-700 overflow-hidden transform transition-all p-6">
        <div class="flex items-center justify-between mb-6">
            <h3 class="text-xl font-bold text-gray-900 dark:text-white flex items-center gap-2">
                <i data-lucide="file-down" class="w-5 h-5 text-primary"></i>
                Download Notes
            </h3>
            <button onclick="closeDownloadModal()"
                class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Scope Selection -->
        <div class="mb-6">
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Include Content</label>
            <div class="space-y-3">
                <label
                    class="flex items-center gap-3 p-3 rounded-lg border border-gray-100 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-700/30 cursor-pointer hover:border-primary/30 transition-colors">
                    <input type="radio" name="notesScope" value="all" checked
                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 focus:ring-primary dark:bg-gray-700">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-200">All Notes (Problems &
                        Reflections)</span>
                </label>
                <label
                    class="flex items-center gap-3 p-3 rounded-lg border border-gray-100 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-700/30 cursor-pointer hover:border-primary/30 transition-colors">
                    <input type="radio" name="notesScope" value="problems"
                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 focus:ring-primary dark:bg-gray-700">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Problem Notes Only</span>
                </label>
                <label
                    class="flex items-center gap-3 p-3 rounded-lg border border-gray-100 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-700/30 cursor-pointer hover:border-primary/30 transition-colors">
                    <input type="radio" name="notesScope" value="reflections"
                        class="w-4 h-4 text-primary bg-gray-100 border-gray-300 focus:ring-primary dark:bg-gray-700">
                    <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Reflections Only</span>
                </label>
            </div>
        </div>

        <!-- Metadata Selection -->
        <div class="mb-8">
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-3">Enrich with Data</label>
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="includeStatement"
                        class="w-4 h-4 rounded text-primary focus:ring-primary border-gray-300 dark:bg-gray-700"
                        checked>
                    <span class="text-sm text-gray-600 dark:text-gray-300">Problem Statement</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="includeComplexity"
                        class="w-4 h-4 rounded text-primary focus:ring-primary border-gray-300 dark:bg-gray-700"
                        checked>
                    <span class="text-sm text-gray-600 dark:text-gray-300">Time/Space Complexity</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="includeExamples"
                        class="w-4 h-4 rounded text-primary focus:ring-primary border-gray-300 dark:bg-gray-700">
                    <span class="text-sm text-gray-600 dark:text-gray-300">Examples</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="includeConstraints"
                        class="w-4 h-4 rounded text-primary focus:ring-primary border-gray-300 dark:bg-gray-700">
                    <span class="text-sm text-gray-600 dark:text-gray-300">Constraints</span>
                </label>
            </div>
        </div>

        <!-- Actions -->
        <div class="flex gap-3">
            <button onclick="closeDownloadModal()"
                class="flex-1 px-4 py-2.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors text-sm">
                Cancel
            </button>
            <button onclick="downloadPDF()"
                class="flex-1 px-4 py-2.5 bg-gradient-to-r from-primary to-secondary text-white font-bold rounded-xl shadow-lg shadow-primary/25 hover:shadow-xl hover:shadow-primary/40 hover:-translate-y-0.5 transition-all text-sm flex items-center justify-center gap-2">
                <i data-lucide="download" class="w-4 h-4"></i> Download PDF
            </button>
        </div>
    </div>
</div>


{{ end }}
