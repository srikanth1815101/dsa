{{ define "main" }}
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 font-sans flex items-center justify-center p-4">

    <!-- Hero Card -->
    <div
        class="w-full max-w-2xl bg-white/90 dark:bg-gray-800/90 backdrop-blur-xl border border-gray-200/50 dark:border-gray-700/50 rounded-3xl p-8 md:p-12 shadow-2xl relative overflow-hidden animate-fade-in-up md:mt-0 mt-20">
        <!-- Decorative Blobs -->
        <div class="absolute top-0 right-0 -mr-24 -mt-24 w-64 h-64 bg-primary/10 rounded-full blur-3xl animate-pulse">
        </div>
        <div
            class="absolute bottom-0 left-0 -ml-24 -mb-24 w-64 h-64 bg-secondary/10 rounded-full blur-3xl animate-pulse delay-700">
        </div>

        <div class="relative z-10 text-center">
            <!-- Icon -->
            <div
                class="mx-auto w-24 h-24 bg-gradient-to-br from-primary to-secondary rounded-2xl flex items-center justify-center mb-8 shadow-lg transform rotate-3 hover:rotate-6 transition-transform duration-500">
                <i data-lucide="target" class="w-12 h-12 text-white"></i>
            </div>

            <h1 class="text-4xl md:text-5xl font-black text-gray-900 dark:text-white mb-4 tracking-tight">
                Interview Mode
            </h1>

            <p class="text-lg text-gray-600 dark:text-gray-300 mb-10 leading-relaxed max-w-lg mx-auto">
                Simulate real interview pressure. Solve random problems against the clock.
                <span class="block mt-2 font-medium text-primary">Are you ready?</span>
            </p>

            <button onclick="openConfigModal()"
                class="group relative inline-flex items-center justify-center gap-3 px-10 py-4 bg-gradient-to-r from-gray-900 to-gray-800 dark:from-white dark:to-gray-200 text-white dark:text-gray-900 rounded-2xl font-bold text-xl hover:shadow-2xl hover:scale-[1.02] active:scale-95 transition-all duration-300 w-full sm:w-auto">
                <span>Start Interview</span>
                <i data-lucide="arrow-right" class="w-6 h-6 group-hover:translate-x-1 transition-transform"></i>
            </button>
        </div>
    </div>

</div>

<!-- Configuration Modal -->
<div id="config-modal"
    class="fixed inset-0 z-[60] hidden items-center justify-center bg-gray-900/60 backdrop-blur-sm px-4">
    <div
        class="bg-white dark:bg-gray-800 w-full max-w-lg p-6 md:p-8 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700 relative animate-fade-in-up">

        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-gray-900 dark:text-white">Configure Session</h2>
            <button onclick="closeConfigModal()"
                class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition-colors">
                <i data-lucide="x" class="w-5 h-5 text-gray-500"></i>
            </button>
        </div>

        <div class="space-y-6">
            <!-- Problem Count -->
            <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-3">Number of Problems</label>
                <div class="flex gap-3">
                    <button onclick="selectOption('count', 1)"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all active"
                        data-group="count" data-value="1">1</button>
                    <button onclick="selectOption('count', 3)"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all"
                        data-group="count" data-value="3">3</button>
                    <button onclick="selectOption('count', 5)"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all"
                        data-group="count" data-value="5">5</button>
                </div>
            </div>

            <!-- Duration -->
            <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-3">Time Limit
                    (Minutes)</label>
                <div class="flex gap-3">
                    <button onclick="selectOption('time', 15)"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all"
                        data-group="time" data-value="15">15</button>
                    <button onclick="selectOption('time', 30)"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all active"
                        data-group="time" data-value="30">30</button>
                    <button onclick="selectOption('time', 45)"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all"
                        data-group="time" data-value="45">45</button>
                </div>
            </div>

            <!-- Difficulty -->
            <div>
                <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-3">Difficulty</label>
                <div class="flex gap-3">
                    <button onclick="selectOption('diff', 'Any')"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all active"
                        data-group="diff" data-value="Any">Any</button>
                    <button onclick="selectOption('diff', 'Easy')"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all"
                        data-group="diff" data-value="Easy">Easy</button>
                    <button onclick="selectOption('diff', 'Medium')"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all"
                        data-group="diff" data-value="Medium">Med</button>
                    <button onclick="selectOption('diff', 'Hard')"
                        class="config-btn flex-1 py-3 rounded-xl border-2 border-gray-200 dark:border-gray-700 font-bold text-gray-600 dark:text-gray-400 hover:border-primary hover:text-primary transition-all"
                        data-group="diff" data-value="Hard">Hard</button>
                </div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 mt-8 pt-6 border-t border-gray-100 dark:border-gray-700">
            <button onclick="startSession()"
                class="flex-1 py-3.5 rounded-xl bg-gradient-to-r from-primary to-secondary text-white font-bold text-lg hover:shadow-lg hover:scale-[1.02] transition-all transform active:scale-95 shadow-primary/25">
                Start Session
            </button>
            <button onclick="startDefaults()"
                class="flex-1 py-3.5 rounded-xl bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 font-bold hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors">
                Quick Start (Default)
            </button>
        </div>
    </div>
</div>

<style>
    .config-btn.active {
        border-color: #FF6B35;
        color: #FF6B35;
        background-color: rgba(255, 107, 53, 0.05);
    }

    .dark .config-btn.active {
        background-color: rgba(255, 107, 53, 0.1);
    }
</style>

<script>
    let config = {
        count: 1,
        time: 30,
        diff: 'Any'
    };

    function openConfigModal() {
        document.getElementById('config-modal').classList.remove('hidden');
        document.getElementById('config-modal').classList.add('flex');
    }

    function closeConfigModal() {
        document.getElementById('config-modal').classList.add('hidden');
        document.getElementById('config-modal').classList.remove('flex');
    }

    function selectOption(group, value) {
        config[group] = value;
        // Update UI
        document.querySelectorAll(`.config-btn[data-group="${group}"]`).forEach(btn => {
            if (btn.dataset.value == value) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
    }

    function startDefaults() {
        // Defaults: 1 problem, 30 mins, Any
        // Just redirect to random problem for now (MVP)
        // In full version, this would go to /interview/session?mode=quick
        findAndRedirect();
    }

    function startSession() {
        // Use config
        console.log("Starting session with:", config);
        findAndRedirect(config);
    }

    function findAndRedirect(cfg) {
        // Build query for problems
        // Since this is a static site, we can't filter server side. 
        // We'll fetch the index and filter client side, then pick one.

        fetch('/problems/index.json')
            .then(res => res.json())
            .then(data => {
                let filtered = data;
                if (cfg && cfg.diff && cfg.diff !== 'Any') {
                    filtered = data.filter(p => p.difficulty === cfg.diff);
                }

                if (filtered.length > 0) {
                    const random = filtered[Math.floor(Math.random() * filtered.length)];
                    window.location.href = random.permalink;
                } else {
                    alert('No problems found with these settings! Try "Any".');
                }
            })
            .catch(e => {
                console.error(e);
                window.location.href = '/problems/';
            });
    }
</script>
{{ end }}
