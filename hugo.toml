baseURL = "https://dsa.csrgo.com/"
locale = "en-us"
title = "CSRGO DSA"
buildFuture = true

# Enable emoji support
enableEmoji = true

# Trigger rebuild

# Enable Git info
enableGitInfo = false

# Pagination
[pagination]
  pagerSize = 12

# Output formats
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS", "JSON"]

# Taxonomies
[taxonomies]
  difficulty = "difficulties"
  topic = "topics"
  datastructure = "datastructures"
  paths = "paths"
  company = "companies"

# Menu configuration
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "Problems"
  url = "/problems/"
  weight = 2

[[menu.main]]
  name = "Paths"
  url = "/paths/"
  weight = 3

[[menu.main]]
  name = "Interview"
  url = "/interview/"
  weight = 4

[[menu.main]]
  name = "Notes"
  url = "/notes/"
  weight = 5

[[menu.footer]]
  name = "Guide"
  url = "/guide/"
  weight = 1

[[menu.footer]]
  name = "Contact"
  url = "/contact/"
  weight = 2

[[menu.footer]]
  name = "Support"
  url = "/support/"
  weight = 3

[[menu.footer]]
  name = "About"
  url = "/about/"
  weight = 3


# Site parameters
[params]
  description = "Master Data Structures and Algorithms with CSRGO DSA - Your comprehensive Java DSA learning platform"
  author = "CSRGO"
  
  # Social links
  github = "https://github.com/csrgo"
  twitter = "https://twitter.com/csrgo"
  linkedin = "https://linkedin.com/company/csrgo"
  youtube_playlist = ""
  
  # Logo
  logo = "/logo.png"
  favicon = "/favicon.ico"
  
  # Brand colors from logo (exact matches)
  [params.colors]
    primary = "#FF6B35"      # Orange from logo
    secondary = "#4A90E2"    # Blue from logo
    accent = "#9B59B6"       # Purple from logo
    darkBg = "#0A0E27"       # Dark navy background
    lightBg = "#F8F9FA"      # Light background

# Markup configuration
[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Privacy settings
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
