{{ define "main" }}
<div class="container mx-auto px-4 py-8 max-w-5xl animate-fade-in-up">
    <!-- Breadcrumb -->
    <nav class="mb-6 flex items-center text-sm font-medium text-gray-500 dark:text-gray-400">
        <a href="/" class="hover:text-primary transition-colors flex items-center gap-1">
            <i data-lucide="home" class="w-4 h-4"></i>
        </a>
        <i data-lucide="chevron-right" class="w-4 h-4 mx-2 text-gray-400 dark:text-gray-600"></i>
        <a href="/problems/" class="hover:text-primary transition-colors">Problems</a>
        <i data-lucide="chevron-right" class="w-4 h-4 mx-2 text-gray-400 dark:text-gray-600"></i>
        <span class="text-gray-900 dark:text-white truncate">Solution: {{ .Title }}</span>
    </nav>

    <div
        class="bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/50 rounded-2xl p-8 shadow-sm relative overflow-hidden">
        <!-- Header -->
        <div class="border-b border-gray-100 dark:border-gray-700/50 pb-6 mb-8">
            <h1 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-4">
                {{ .Title }}
            </h1>
            <div class="flex items-center gap-4">
                <a href="{{ .Params.problemUrl }}"
                    class="flex items-center gap-2 text-sm font-medium text-primary hover:text-blue-600 transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Back to Problem
                </a>
                <span class="text-gray-300 dark:text-gray-600">|</span>
                <span class="text-sm text-gray-500 dark:text-gray-400 flex items-center gap-1">
                    <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                    {{ .ReadingTime }} min read
                </span>
            </div>
        </div>

        <!-- Content -->
        <div class="prose prose-lg max-w-none 
            text-gray-600 dark:text-gray-300
            prose-headings:text-gray-900 dark:prose-headings:text-white 
            prose-strong:text-gray-900 dark:prose-strong:text-white 
            prose-code:text-primary dark:prose-code:text-blue-400 
            prose-code:bg-blue-50 dark:prose-code:bg-blue-500/10 
            prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded-md prose-code:before:content-none prose-code:after:content-none
            prose-pre:bg-gray-900 dark:prose-pre:bg-gray-950 prose-pre:border prose-pre:border-gray-800
            prose-a:text-primary dark:prose-a:text-blue-400 prose-a:no-underline hover:prose-a:underline
            prose-li:marker:text-gray-400 dark:prose-li:marker:text-gray-500">
            {{ .Content }}
        </div>
    </div>
</div>
{{ end }}
