{{ define "main" }}
<article class="py-12 animate-fade-in-up">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header -->
        <header class="mb-10 text-center">
            <h1
                class="text-3xl md:text-5xl font-extrabold mb-4 pb-2 bg-gradient-to-r from-blue-600 via-purple-600 to-pink-600 bg-clip-text text-transparent inline-block bg-[length:200%_auto] animate-gradient-x">
                {{ .Title }}
            </h1>
        </header>

        <!-- Content -->
        <div class="legal-prose">
            {{ .Content }}
        </div>
    </div>
</article>

<style>
    /* ── Legal prose — clean, readable typography ── */
    .legal-prose {
        max-width: none;
        font-size: 1.05rem;
        line-height: 1.8;
        color: #374151;
    }

    html[data-theme="dark"] .legal-prose {
        color: #D1D5DB;
    }

    /* Headings */
    .legal-prose h1,
    .legal-prose h2,
    .legal-prose h3,
    .legal-prose h4,
    .legal-prose h5,
    .legal-prose h6 {
        font-weight: 700;
        line-height: 1.3;
        color: #111827;
    }

    html[data-theme="dark"] .legal-prose h1,
    html[data-theme="dark"] .legal-prose h2,
    html[data-theme="dark"] .legal-prose h3,
    html[data-theme="dark"] .legal-prose h4 {
        color: #F3F4F6;
    }

    .legal-prose h2 {
        font-size: 1.65rem;
        margin-top: 2.5rem;
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid #E5E7EB;
    }

    html[data-theme="dark"] .legal-prose h2 {
        border-bottom-color: #374151;
    }

    .legal-prose>h2:first-child {
        margin-top: 0;
    }

    .legal-prose h3 {
        font-size: 1.3rem;
        margin-top: 1.75rem;
        margin-bottom: 0.75rem;
    }

    /* Paragraphs */
    .legal-prose p {
        margin-bottom: 1.25rem;
    }

    /* Bold */
    .legal-prose strong {
        font-weight: 700;
        color: #111827;
    }

    html[data-theme="dark"] .legal-prose strong {
        color: #F9FAFB;
    }

    /* Links */
    .legal-prose a {
        color: #3B82F6;
        text-decoration: underline;
        text-underline-offset: 2px;
    }

    .legal-prose a:hover {
        color: #2563EB;
    }

    html[data-theme="dark"] .legal-prose a {
        color: #60A5FA;
    }

    html[data-theme="dark"] .legal-prose a:hover {
        color: #93BBFD;
    }

    /* Lists */
    .legal-prose ul,
    .legal-prose ol {
        margin: 1.25rem 0;
        padding-left: 1.5rem;
    }

    .legal-prose ul {
        list-style-type: disc;
    }

    .legal-prose ol {
        list-style-type: decimal;
    }

    .legal-prose li {
        margin: 0.5rem 0;
        line-height: 1.75;
    }

    /* Nested lists */
    .legal-prose ul ul,
    .legal-prose ol ul {
        margin-top: 0.25rem;
        margin-bottom: 0.25rem;
    }

    /* Inline code */
    .legal-prose code {
        background: #F3F4F6;
        padding: 0.125rem 0.35rem;
        border-radius: 0.25rem;
        font-size: 0.9em;
        font-family: 'Fira Code', monospace;
        color: #111827;
    }

    html[data-theme="dark"] .legal-prose code {
        background: #374151;
        color: #F3F4F6;
    }

    /* Blockquotes */
    .legal-prose blockquote {
        border-left: 4px solid #3B82F6;
        padding-left: 1rem;
        margin: 1.5rem 0;
        font-style: italic;
        color: #6B7280;
    }

    html[data-theme="dark"] .legal-prose blockquote {
        color: #9CA3AF;
    }

    /* HR */
    .legal-prose hr {
        border: none;
        border-top: 1px solid #E5E7EB;
        margin: 2rem 0;
    }

    html[data-theme="dark"] .legal-prose hr {
        border-top-color: #374151;
    }

    @media (min-width: 768px) {
        .legal-prose h2 {
            font-size: 1.875rem;
        }

        .legal-prose h3 {
            font-size: 1.5rem;
        }
    }
</style>
{{ end }}
