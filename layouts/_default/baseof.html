<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="author" content="{{ .Site.Params.author }}">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <!-- Theme Color -->
    <meta name="theme-color" content="{{ .Site.Params.colors.primary }}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Core Logic -->
    <script src="/js/db.js?v=2"></script>
    <script src="/js/problem-utils.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                        secondary: '#9B59B6',
                        accent: '#FF6B35',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                    backgroundImage: {
                        'gradient-primary': 'linear-gradient(135deg, #FF6B35 0%, #4A90E2 50%, #9B59B6 100%)',
                        'gradient-secondary': 'linear-gradient(135deg, #4A90E2 0%, #9B59B6 100%)',
                        'gradient-accent': 'linear-gradient(90deg, #FF6B35 0%, #FF8C5A 50%, #4A90E2 100%)',
                        'gradient-warm': 'linear-gradient(135deg, #FF6B35 0%, #FF7F66 100%)',
                        'gradient-cool': 'linear-gradient(135deg, #4A90E2 0%, #8B5CF6 100%)',
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 1s cubic-bezier(0.25, 1, 0.5, 1) forwards',
                        'fade-in': 'fadeIn 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards',
                        'blob': 'blob 7s infinite',
                        'pop-in': 'popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards',
                        'float': 'float 6s ease-in-out infinite',
                        'gradient-x': 'gradient-x 15s ease infinite',
                        'slide-up': 'slideUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        popIn: {
                            '0%': { opacity: '0', transform: 'scale(0.8) translateY(10px)' },
                            '100%': { opacity: '1', transform: 'scale(1) translateY(0)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        },
                        'gradient-x': {
                            '0%, 100%': {
                                'background-size': '200% 200%',
                                'background-position': 'left center'
                            },
                            '50%': {
                                'background-size': '200% 200%',
                                'background-position': 'right center'
                            },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Custom CSS -->
    <style>
        :root {
            /* ONLY logo colors in gradients */
            --gradient-primary: linear-gradient(135deg, #FF6B35 0%, #4A90E2 50%, #9B59B6 100%);
            --gradient-secondary: linear-gradient(135deg, #4A90E2 0%, #9B59B6 100%);
            --gradient-accent: linear-gradient(90deg, #FF6B35 0%, #4A90E2 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        html[data-theme="dark"] body {
            background-color: #0A0E27;
            color: #E5E7EB;
        }

        html[data-theme="light"] body {
            background-color: #F8F9FA;
            color: #1F2937;
        }

        .gradient-text {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .gradient-bg {
            background: var(--gradient-primary);
        }

        .gradient-border {
            position: relative;
            background: transparent;
        }

        .gradient-border::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 2px;
            background: var(--gradient-primary);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        html[data-theme="dark"] .card {
            background-color: #141B3D;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        html[data-theme="dark"] .card:hover {
            box-shadow: 0 12px 24px rgba(255, 107, 53, 0.3),
                0 8px 16px rgba(74, 144, 226, 0.2),
                0 4px 8px rgba(155, 89, 182, 0.2);
        }

        html[data-theme="light"] .card {
            background-color: #FFFFFF;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        html[data-theme="light"] .card:hover {
            box-shadow: 0 12px 24px rgba(255, 107, 53, 0.2),
                0 8px 16px rgba(74, 144, 226, 0.15),
                0 4px 8px rgba(155, 89, 182, 0.1);
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(255, 107, 53, 0.3);
        }

        .btn-outline {
            border: 2px solid;
            border-image: var(--gradient-primary) 1;
            background: transparent;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        html[data-theme="dark"] .btn-outline {
            color: #FF6B35;
        }

        html[data-theme="light"] .btn-outline {
            color: #FF6B35;
        }

        .btn-outline:hover {
            background: var(--gradient-primary);
            color: white;
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        html[data-theme="dark"] ::-webkit-scrollbar-track {
            background: #0A0E27;
        }

        html[data-theme="dark"] ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #FF6B35, #4A90E2, #9B59B6);
            border-radius: 6px;
        }

        html[data-theme="light"] ::-webkit-scrollbar-track {
            background: #F8F9FA;
        }

        html[data-theme="light"] ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #FF6B35, #4A90E2, #9B59B6);
            border-radius: 6px;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        .pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        /* Smooth Page Transitions */
        body {
            opacity: 1;
            transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s ease, color 0.3s ease;
        }

        body.page-transitioning {
            opacity: 0;
            pointer-events: none;
        }
    </style>

    <!-- Theme Toggle Script -->
    <script>
            // Initialize theme from localStorage or default to light
            (function () {
                const theme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            })();
    </script>

    <!-- Initialize Lucide Icons -->
    <script>
        lucide.createIcons();
    </script>

    <!-- Theme Toggle Functionality -->
    <script>
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            if (newTheme === 'dark') {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }

            // Update icon
            const themeIcon = document.getElementById('theme-icon');
            if (themeIcon) {
                // If the new theme is dark, the icon to switch back to light is 'sun'. 
                // If the new theme is light, the icon to switch to dark is 'moon'.
                themeIcon.setAttribute('data-lucide', newTheme === 'dark' ? 'sun' : 'moon');
                lucide.createIcons();
            }
        }

        // Mobile menu toggle
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('hidden');
        }

        // Fix: Close mobile menu on page show (handles bfcache/back swiping)
        window.addEventListener('pageshow', () => {
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.add('hidden');
            }
        });

        // Close menu when a link is clicked
        document.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('#mobile-menu a');
            items.forEach(link => {
                link.addEventListener('click', () => {
                    const mobileMenu = document.getElementById('mobile-menu');
                    mobileMenu.classList.add('hidden');
                });
            });

            // Smooth Page Transitions
            document.body.classList.remove('page-transitioning');
        });

        // Intercept navigation for smooth fade out
        document.addEventListener('click', e => {
            const link = e.target.closest('a');
            if (!link || !link.href) return;

            // Ignore external links, new tabs, downloads, or anchor links
            const isExternal = link.hostname !== window.location.hostname;
            const isNewTab = link.target === '_blank';
            const isDownload = link.hasAttribute('download');
            const isAnchor = link.getAttribute('href').startsWith('#');

            if (!isExternal && !isNewTab && !isDownload && !isAnchor) {
                // If it's a guide-prompt modal intercept, let header.html handle it first
                const hasSeenGuidePrompt = localStorage.getItem('dsa-seen-guide-prompt');
                const isGuide = link.pathname.includes('/guide');

                if (hasSeenGuidePrompt || isGuide) {
                    e.preventDefault();
                    document.body.classList.add('page-transitioning');
                    setTimeout(() => {
                        window.location.href = link.href;
                    }, 300); // match transition duration
                }
            }
        });

        // Handle browser back/forward buttons graceful restore
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) {
                document.body.classList.remove('page-transitioning');
            }
        });
    </script>
</body>
