{{ define "main" }}
<script src="/js/interview-manager.js"></script>
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 py-12 px-4">
    <div class="max-w-4xl mx-auto space-y-8 animate-fade-in-up">

        <!-- HEADER -->
        <div class="text-center space-y-2">
            <h1 class="text-3xl font-black text-gray-900 dark:text-white">Session Review</h1>
            <p class="text-gray-500 dark:text-gray-400">Great job completing your interview session. Take a moment to
                reflect.</p>
        </div>

        <!-- SUMMARY CARD -->
        <div class="bg-white dark:bg-gray-800 rounded-3xl p-8 shadow-xl border border-gray-100 dark:border-gray-700/50">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center">
                <div class="space-y-1">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Duration</p>
                    <p class="text-2xl font-black text-indigo-600 dark:text-indigo-400" id="total-time">--:--</p>
                </div>
                <div class="space-y-1">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Problems</p>
                    <p class="text-2xl font-black text-gray-900 dark:text-white" id="problem-count">0</p>
                </div>
                <div class="space-y-1">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Solved</p>
                    <p class="text-2xl font-black text-green-600 dark:text-green-400" id="solved-count">0</p>
                </div>
                <div class="space-y-1">
                    <p class="text-xs font-bold text-gray-400 uppercase tracking-wider">Difficulty</p>
                    <p class="text-2xl font-black text-gray-900 dark:text-white" id="difficulty-label">Mixed</p>
                </div>
            </div>
        </div>

        <!-- PROBLEM LIST -->
        <div class="space-y-4">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white px-2">Performance Breakdown</h2>
            <div id="problem-list" class="grid gap-4">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- REFLECTION -->
        <div class="bg-white dark:bg-gray-800 rounded-3xl p-8 shadow-lg border border-gray-100 dark:border-gray-700/50">
            <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-4 flex items-center gap-2">
                <i data-lucide="sparkles" class="w-5 h-5 text-yellow-500"></i>
                Reflection
            </h2>
            <textarea id="reflection-text"
                class="w-full h-32 p-4 rounded-xl bg-gray-50 dark:bg-gray-900/50 border border-gray-200 dark:border-gray-700 focus:ring-2 focus:ring-primary/50 outline-none resize-none mb-4"
                placeholder="What went well? What technical concepts do you need to review?"></textarea>

            <button onclick="saveReflection()" id="save-btn"
                class="px-6 py-3 rounded-xl bg-primary text-white font-bold hover:shadow-lg hover:scale-[1.02] transition-all flex items-center gap-2">
                <i data-lucide="save" class="w-4 h-4"></i> Save to History
            </button>
        </div>

        <!-- ACTIONS -->
        <div class="flex justify-center gap-4 pt-8">
            <a href="/interview/"
                class="px-6 py-3 rounded-xl bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-bold hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors">
                New Session
            </a>
            <a href="/interview/history/"
                class="px-6 py-3 rounded-xl bg-gray-900 dark:bg-white text-white dark:text-gray-900 font-bold hover:shadow-lg transition-all">
                View History
            </a>
        </div>

    </div>
</div>

<script>
    const manager = window.InterviewManager;
    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('id');
    let session = null;

    (function () {
        if (!sessionId) {
            window.location.href = '/interview/history/';
            return;
        }

        session = manager.loadSession(sessionId);
        if (!session) {
            window.location.href = '/interview/history/';
            return;
        }

        // Render Data
        renderSummary();
        renderProblems();

        // Load existing reflection
        if (session.notes && session.notes.reflection) {
            document.getElementById('reflection-text').value = session.notes.reflection;
        }

        lucide.createIcons();
    })();

    function renderSummary() {
        const totalSec = session.problems.reduce((acc, p) => acc + (p.timeSpentSeconds || 0), 0);
        document.getElementById('total-time').textContent = manager.formatTime(totalSec);
        document.getElementById('problem-count').textContent = session.problems.length;
        document.getElementById('solved-count').textContent = session.problems.filter(p => p.status === 'solved').length;
        document.getElementById('difficulty-label').textContent = session.config.difficulty || 'Mixed';
    }

    function renderProblems() {
        const container = document.getElementById('problem-list');
        container.innerHTML = session.problems.map(p => `
            <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-700/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <h3 class="font-bold text-gray-900 dark:text-white text-lg">${p.title}</h3>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="px-2 py-0.5 rounded text-xs font-bold bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-400">${p.difficulty}</span>
                        <span class="text-sm text-gray-400">•</span>
                        <span class="text-sm font-mono text-gray-500 dark:text-gray-400">Time: ${manager.formatTime(p.timeSpentSeconds || 0)}</span>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    ${getStatusBadge(p.status)}
                    <a href="${p.permalink}" target="_blank" class="p-2 text-primary hover:bg-primary/10 rounded-lg transition-colors" title="View Problem">
                        <i data-lucide="external-link" class="w-5 h-5"></i>
                    </a>
                </div>
            </div>
        `).join('');
    }

    function getStatusBadge(status) {
        if (status === 'solved') return '<span class="px-3 py-1 rounded-full bg-green-100 dark:bg-green-900/30 text-green-700 dark:text-green-400 font-bold text-sm flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> Solved</span>';
        if (status === 'attempted') return '<span class="px-3 py-1 rounded-full bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-400 font-bold text-sm flex items-center gap-1"><i data-lucide="minus" class="w-3 h-3"></i> Attempted</span>';
        return '<span class="px-3 py-1 rounded-full bg-gray-100 dark:bg-gray-700 text-gray-500 font-bold text-sm">Skipped</span>';
    }

    function saveReflection() {
        const text = document.getElementById('reflection-text').value;
        session.notes.reflection = text;
        manager.saveDB();

        const btn = document.getElementById('save-btn');
        const originalHTML = btn.innerHTML;
        btn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Saved`;
        btn.classList.replace('bg-primary', 'bg-green-600');

        setTimeout(() => {
            btn.innerHTML = originalHTML;
            btn.classList.replace('bg-green-600', 'bg-primary');
            lucide.createIcons();
        }, 2000);
    }
</script>
{{ end }}
