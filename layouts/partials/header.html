<header class="fixed top-2 sm:top-4 left-2 sm:left-4 right-2 sm:right-4 z-50 transition-all duration-300">
    <div class="max-w-7xl mx-auto">
        <div
            class="bg-white/90 dark:bg-gray-800/90 backdrop-blur-xl border border-gray-200/50 dark:border-gray-600/50 rounded-xl sm:rounded-2xl px-4 sm:px-6 py-3 sm:py-4 shadow-lg shadow-purple-500/10 dark:shadow-purple-400/10 relative">
            <div class="flex justify-between items-center">
                <!-- Logo and Site Title -->
                <!-- Logo and Site Title -->
                <!-- Logo and Site Title -->
                <div class="flex items-center space-x-2 sm:space-x-3">
                    <a href="/" class="flex items-center">
                        <div class="relative flex items-center justify-center p-1">
                            <img src="/logo.png" alt="CSRGO" class="w-6 h-6 sm:w-8 sm:h-8 relative z-10" />
                        </div>

                        <!-- Separator -->
                        <div class="h-4 sm:h-6 w-px bg-gray-200 dark:bg-gray-700 mx-1.5 sm:mx-2 self-center"></div>

                        <!-- Brand Text -->
                        <div class="h-6 sm:h-8 flex items-center">
                            <span
                                class="text-xl sm:text-3xl font-black tracking-tighter bg-clip-text text-transparent bg-gradient-to-r from-purple-600 to-blue-600 leading-none pt-0.5">
                                CSRGO DSA
                            </span>
                        </div>
                    </a>
                </div>

                <!-- Right Side Container (Nav + Actions) -->
                <div class="flex items-center space-x-4 sm:space-x-6">
                    <!-- Desktop Navigation -->
                    <div class="hidden md:flex gap-8 text-base font-medium">
                        {{ range .Site.Menus.main }}
                        <a href="{{ .URL }}"
                            class="relative py-2 px-2 transition text-gray-700 dark:text-gray-200 hover:text-blue-600 dark:hover:text-fuchsia-400 {{ if eq $.RelPermalink .URL }}font-bold text-blue-600 dark:text-fuchsia-400{{ end }}">
                            {{ .Name }}
                            <span
                                class="absolute left-0 -bottom-1 w-full h-0.5 rounded bg-gradient-to-r from-blue-600 via-fuchsia-500 to-pink-500 transition-all duration-300 scale-x-0 origin-left {{ if eq $.RelPermalink .URL }}scale-x-100{{ end }}"></span>
                        </a>
                        {{ end }}
                    </div>

                    <!-- Right Actions -->
                    <div class="flex items-center space-x-1 sm:space-x-2">
                        <!-- Theme Toggle Button -->
                        <button onclick="toggleTheme()"
                            class="p-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-600 dark:text-gray-200 dark:hover:bg-gray-800 dark:hover:text-fuchsia-400 transition-colors duration-200"
                            aria-label="Toggle theme">
                            <i id="theme-icon" data-lucide="sun" stroke-width="2" class="w-6 h-6"></i>
                        </button>

                        <!-- Profile Button -->
                        <a href="/profile/"
                            class="p-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-600 dark:text-gray-200 dark:hover:bg-gray-800 dark:hover:text-fuchsia-400 transition-colors duration-200"
                            aria-label="User Profile">
                            <i data-lucide="user" stroke-width="2" class="w-6 h-6"></i>
                        </a>

                        <!-- Mobile Menu Button -->
                        <button onclick="toggleMobileMenu()"
                            class="md:hidden p-2 rounded-lg text-gray-700 hover:bg-gray-100 hover:text-blue-600 dark:text-gray-200 dark:hover:bg-gray-800 dark:hover:text-fuchsia-400 transition-colors duration-200"
                            aria-label="Toggle menu">
                            <i data-lucide="menu" stroke-width="2" class="w-6 h-6"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Mobile Navigation Dropdown -->
            <div id="mobile-menu"
                class="hidden md:hidden pt-4 mt-2 border-t border-gray-200/50 dark:border-gray-700/50 space-y-2">
                {{ range .Site.Menus.main }}
                <a href="{{ .URL }}"
                    class="block px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 {{ if eq $.RelPermalink .URL }}bg-gradient-to-r from-purple-50 to-blue-50 dark:from-purple-900/20 dark:to-blue-900/20 text-purple-700 dark:text-purple-300{{ else }}text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800/50{{ end }}">
                    <span>{{ .Name }}</span>
                </a>
                {{ end }}
                <a href="/profile/"
                    class="block px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 text-gray-600 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800/50">
                    <span>Profile</span>
                </a>
            </div>
        </div>
    </div>
</header>

<!-- Nickname Modal (Global) -->
<div id="nickname-modal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-gray-900/60 backdrop-blur-md px-4">
    <div
        class="bg-white dark:bg-gray-800 w-full max-w-md p-8 rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700 relative overflow-hidden animate-fade-in-up">
        <!-- decorative blobs -->
        <div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 bg-primary/20 rounded-full blur-2xl"></div>
        <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-32 h-32 bg-secondary/20 rounded-full blur-2xl"></div>

        <div class="relative z-10 text-center">
            <div
                class="w-16 h-16 bg-gradient-to-br from-primary to-secondary rounded-2xl mx-auto flex items-center justify-center mb-6 shadow-lg rotate-3">
                <i data-lucide="sparkles" class="w-8 h-8 text-white"></i>
            </div>

            <h2 class="text-2xl font-black text-gray-900 dark:text-white mb-2">Welcome!</h2>
            <p class="text-gray-600 dark:text-gray-300 mb-8">What should we call you?</p>

            <form onsubmit="saveNickname(event)" class="space-y-4">
                <input type="text" id="nickname-input" required maxlength="20" placeholder="Enter your nickname"
                    class="w-full px-5 py-4 rounded-xl bg-gray-50 dark:bg-gray-900 border-2 border-gray-100 dark:border-gray-700 focus:border-primary dark:focus:border-primary outline-none transition-all text-center font-bold text-lg dark:text-white placeholder-gray-400">

                <button type="submit"
                    class="w-full py-4 rounded-xl bg-gradient-to-r from-primary to-secondary text-white font-bold text-lg hover:shadow-lg hover:scale-[1.02] transition-all transform active:scale-95 shadow-primary/25">
                    Start Journey
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    // Global Nickname Logic
    function checkNickname() {
        const nickname = localStorage.getItem('dsa-nickname');
        const modal = document.getElementById('nickname-modal');
        // Do not block if we are already on a page but the logic runs (avoid flicker)
        // But for first time, we force it.
        // Exception: Dont show if we just cleared it on profile page to edit
        // Actually editing removes it so we DO want to show it.
        if (!nickname) {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('nickname-input').focus();
        } else {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    }

    function saveNickname(e) {
        e.preventDefault();
        const input = document.getElementById('nickname-input');
        const name = input.value.trim();
        if (name) {
            localStorage.setItem('dsa-nickname', name);
            // Hide modal
            document.getElementById('nickname-modal').classList.add('hidden');
            document.getElementById('nickname-modal').classList.remove('flex');
            // If on profile page, reload to update name
            if (window.location.pathname.includes('/profile')) {
                window.location.reload();
            }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        // Run check
        checkNickname();
        // Also update Lucide again for the new icon
        if (window.lucide) window.lucide.createIcons();
    });
</script>
