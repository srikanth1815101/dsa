{{ define "main" }}
<script src="/js/interview-manager.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<div class="min-h-screen bg-gray-50 dark:bg-gray-900 font-sans pb-20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 md:pt-8 animate-fade-in-up">

        <!-- Enhanced Header Card -->
        <div
            class="relative bg-white dark:bg-gray-800 rounded-2xl p-4 md:p-8 mb-8 md:mb-12 border border-gray-200 dark:border-gray-700/50 shadow-sm group overflow-hidden">

            <!-- Animated Background Blobs -->
            <div class="absolute inset-0 overflow-hidden pointer-events-none rounded-2xl">
                <div
                    class="absolute -top-32 -right-32 w-96 h-96 bg-primary/5 rounded-full blur-3xl group-hover:bg-primary/10 transition-colors duration-700">
                </div>
                <div
                    class="absolute -bottom-32 -left-32 w-96 h-96 bg-secondary/5 rounded-full blur-3xl group-hover:bg-secondary/10 transition-colors duration-700">
                </div>
            </div>

            <div class="relative z-10 flex flex-col md:flex-row md:items-end justify-between gap-6 md:gap-8">
                <div class="flex-1">
                    <div class="flex items-center gap-3 mb-3 md:mb-4">
                        <div class="p-2 bg-gradient-to-br from-primary/10 to-blue-500/10 rounded-xl">
                            <i data-lucide="notebook-pen" class="w-5 h-5 md:w-6 md:h-6 text-primary"></i>
                        </div>
                        <h1
                            class="text-2xl md:text-3xl lg:text-4xl font-extrabold text-gray-900 dark:text-white tracking-tight leading-tight">
                            Personal Notes
                        </h1>
                    </div>

                    <p class="text-gray-500 dark:text-gray-400 max-w-xl text-base md:text-lg leading-relaxed">
                        A collection of your thoughts, problem strategies, and interview reflections.
                    </p>
                </div>

                <!-- Stats / Decoration -->
                <div class="flex items-center gap-2 md:self-end">
                    <button onclick="window.openDownloadModal()"
                        class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm shadow-lg shadow-blue-500/20 hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">
                        <i data-lucide="download" class="w-4 h-4"></i>
                        <span>Download PDF</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- TABS & CONTROLS -->
        <div class="flex flex-col lg:flex-row gap-4 lg:gap-6 mb-8 justify-between items-stretch lg:items-center">

            <!-- Pill Tabs -->
            <div
                class="bg-white dark:bg-gray-800 p-1 rounded-full border border-gray-200 dark:border-gray-700/50 shadow-sm flex flex-row w-full md:w-auto">
                <button onclick="switchTab('problems')" id="tab-problems"
                    class="flex-1 md:flex-none justify-center px-4 md:px-6 py-2 rounded-full text-sm font-semibold transition-all duration-300 flex items-center gap-2">
                    <i data-lucide="book-open" class="w-4 h-4"></i>
                    Problem Notes
                </button>
                <button onclick="switchTab('reflections')" id="tab-reflections"
                    class="flex-1 md:flex-none justify-center px-4 md:px-6 py-2 rounded-full text-sm font-semibold text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white transition-all duration-300 flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i>
                    Reflections
                </button>
            </div>

            <!-- Search and Filters -->
            <div class="w-full lg:w-auto flex flex-col md:flex-row gap-3">
                <div class="relative group w-full md:w-auto md:flex-initial">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="search"
                            class="h-4 w-4 text-gray-400 group-focus-within:text-primary transition-colors"></i>
                    </div>
                    <input type="text" id="searchInput" placeholder="Search notes..."
                        class="pl-10 pr-4 py-2.5 w-full md:w-64 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/50 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm transition-all shadow-sm">
                </div>

                <div class="relative group w-full md:w-auto min-w-[140px]" id="difficultyFilterContainer">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <i data-lucide="bar-chart-2"
                            class="h-4 w-4 text-gray-400 group-focus-within:text-primary transition-colors"></i>
                    </div>
                    <select id="difficultyFilter"
                        class="pl-10 pr-8 py-2.5 w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700/50 rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary text-sm appearance-none cursor-pointer shadow-sm transition-all whitespace-nowrap overflow-hidden text-ellipsis">
                        <option value="">All Difficulties</option>
                        <option value="Easy">Easy</option>
                        <option value="Medium">Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                        <i data-lucide="chevron-down" class="h-4 w-4 text-gray-400"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- CONTENT CONTAINERS -->
        <div id="container-problems" class="space-y-4">
            <!-- No Results State -->
            <div id="noResults" class="hidden text-center py-12">
                <div
                    class="bg-gray-50 dark:bg-gray-800 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="search-x" class="w-8 h-8 text-gray-400"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">No matches found</h3>
                <p class="text-gray-500 dark:text-gray-400">Try adjusting your search.</p>
            </div>

            <!-- Problem Notes List -->
            <div id="problem-notes-list" class="space-y-3">
                <div class="py-12 text-center text-gray-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                    <p>Loading notes...</p>
                </div>
            </div>
        </div>

        <!-- Reflections Container (Previously missing in this reconstruction but present in file) -->
        <div id="container-reflections" class="hidden space-y-4">
            <!-- No Results State Reflections -->
            <div id="noResultsReflections" class="hidden text-center py-12">
                <div
                    class="bg-gray-50 dark:bg-gray-800 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="search-x" class="w-8 h-8 text-gray-400"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2">No matches found</h3>
                <p class="text-gray-500 dark:text-gray-400">Try adjusting your search.</p>
            </div>

            <!-- Reflections List -->
            <div id="reflections-list" class="space-y-3">
                <div class="py-12 text-center text-gray-400">
                    <i data-lucide="loader-2" class="w-8 h-8 animate-spin mx-auto mb-2"></i>
                    <p>Loading reflections...</p>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="/js/notes-features.js"></script>

<!-- Download Modal -->
<div id="downloadModal"
    class="fixed inset-0 z-[100] hidden items-center justify-center bg-gray-900/60 backdrop-blur-md px-4 py-4 sm:py-8 overflow-y-auto">
    <div
        class="bg-white dark:bg-gray-800 w-full max-w-xl rounded-2xl md:rounded-3xl shadow-2xl border border-gray-100 dark:border-gray-700 relative animate-fade-in-up transform transition-all overflow-hidden group my-auto">

        <!-- Decorative bg blobs -->
        <div
            class="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 bg-blue-500/10 rounded-full blur-3xl pointer-events-none">
        </div>
        <div
            class="absolute bottom-0 left-0 -ml-20 -mb-20 w-64 h-64 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none">
        </div>

        <!-- Sticky Header -->
        <div
            class="sticky top-0 z-20 bg-white/80 dark:bg-gray-800/80 backdrop-blur-md px-5 py-3 md:px-6 md:py-4 border-b border-gray-100 dark:border-gray-700 flex justify-between items-center shrink-0">
            <div>
                <h2
                    class="text-lg md:text-2xl font-black text-gray-900 dark:text-white tracking-tight flex items-center gap-2 md:gap-3">
                    <div
                        class="p-1.5 md:p-2 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-lg shadow-lg shrink-0">
                        <i data-lucide="file-down" class="w-4 h-4 md:w-5 md:h-5 text-white"></i>
                    </div>
                    Download Notes
                </h2>
            </div>
            <button onclick="closeDownloadModal()"
                class="p-1.5 -mr-1.5 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-full transition-colors group/close">
                <i data-lucide="x"
                    class="w-5 h-5 text-gray-400 group-hover/close:text-gray-600 dark:text-gray-500 dark:group-hover/close:text-gray-300 transition-colors"></i>
            </button>
        </div>

        <!-- Scrollable Content -->
        <div class="px-5 py-4 md:p-6 relative z-10 overflow-y-auto custom-scrollbar">

            <!-- Scope Section -->
            <div class="mb-6">
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Include
                    Content</label>
                <div class="grid grid-cols-1 gap-2.5">
                    <!-- All Notes -->
                    <label
                        class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-900 cursor-pointer hover:border-blue-500/50 transition-all">
                        <input type="radio" name="notesScope" value="all" checked
                            onchange="updateDownloadAvailability()"
                            class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-600">
                        <div class="flex-1">
                            <span class="block text-sm font-bold text-gray-900 dark:text-white">All Notes</span>
                            <span class="block text-xs text-gray-500">Includes both problem solutions and
                                reflections</span>
                        </div>
                    </label>
                    <div class="grid grid-cols-2 gap-2.5">
                        <label
                            class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-900 cursor-pointer hover:border-blue-500/50 transition-all">
                            <input type="radio" name="notesScope" value="problems"
                                onchange="updateDownloadAvailability()"
                                class="w-4 h-4 text-blue-600 border-gray-300 focus:ring-blue-500 dark:bg-gray-800 dark:border-gray-600">
                            <span class="text-sm font-bold text-gray-900 dark:text-white">Problem Notes</span>
                        </label>
                        <label
                            class="group relative flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-900 cursor-pointer hover:border-blue-500/50 transition-all">
                            <input type="radio" name="notesScope" value="reflections"
                                onchange="updateDownloadAvailability()"
                                class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300 dark:bg-gray-800 dark:border-gray-600">
                            <span class="text-sm font-bold text-gray-900 dark:text-white">Reflections</span>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Metadata Section -->
            <div class="mb-2">
                <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Enrich with
                    Data</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <label
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-900 cursor-pointer hover:border-blue-500/50 transition-all">
                        <input type="checkbox" id="includeStatement" checked
                            class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-gray-300 dark:bg-gray-800 dark:border-gray-600">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Problem Statement</span>
                    </label>
                    <label
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-900 cursor-pointer hover:border-blue-500/50 transition-all">
                        <input type="checkbox" id="includeComplexity" checked
                            class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-gray-300 dark:bg-gray-800 dark:border-gray-600">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Time/Space Complexity</span>
                    </label>
                    <label
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-900 cursor-pointer hover:border-blue-500/50 transition-all">
                        <input type="checkbox" id="includeExamples"
                            class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-gray-300 dark:bg-gray-800 dark:border-gray-600">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Examples</span>
                    </label>
                    <label
                        class="flex items-center gap-3 px-3 py-2.5 rounded-lg border border-gray-200 dark:border-gray-700/50 bg-gray-50 dark:bg-gray-900 cursor-pointer hover:border-blue-500/50 transition-all">
                        <input type="checkbox" id="includeConstraints"
                            class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500 border-gray-300 dark:bg-gray-800 dark:border-gray-600">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-200">Constraints</span>
                    </label>
                </div>
            </div>

            <!-- Validation Message -->
            <div id="download-availability-message"
                class="mt-4 md:mt-6 text-center text-xs font-bold min-h-[20px] transition-all duration-300">
                <span class="flex items-center justify-center gap-1.5 text-gray-400">
                    <i data-lucide="loader-2" class="w-3.5 h-3.5 animate-spin"></i> Checking notes...
                </span>
            </div>

        </div>

        <!-- Sticky Footer -->
        <div
            class="p-4 md:p-6 border-t border-gray-100 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/50 backdrop-blur-sm relative z-20 shrink-0 flex gap-3">
            <button onclick="closeDownloadModal()"
                class="flex-1 py-3 md:py-3.5 rounded-xl border border-gray-200 dark:border-gray-700 font-bold text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700/50 transition-colors">
                Cancel
            </button>
            <button onclick="downloadPDF()" id="btn-download-pdf"
                class="flex-[2] py-3 md:py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-bold text-sm hover:shadow-xl hover:shadow-blue-500/20 hover:scale-[1.01] transition-all transform active:scale-95 flex items-center justify-center gap-2 disabled:opacity-50 disabled:grayscale disabled:cursor-not-allowed">
                <i data-lucide="download" class="w-4 h-4"></i> Download PDF
            </button>
        </div>
    </div>
</div>


{{ end }}
